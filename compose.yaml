services:
  postgres:
    image: postgres:16-alpine
    container_name: echotrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echotrace}
      POSTGRES_USER: ${POSTGRES_USER:-echotrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echotrace_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echotrace} -d ${POSTGRES_DB:-echotrace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echotrace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-echotrace}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-echotrace}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-echotrace_secret_password}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echotrace-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
