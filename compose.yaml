services:
  postgres:
    image: postgres:16-alpine
    container_name: echotrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: echotrace
      POSTGRES_USER: echotrace_user
      POSTGRES_PASSWORD: echotrace_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echotrace_user -d echotrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echotrace-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/echotrace
      SPRING_DATASOURCE_USERNAME: echotrace_user
      SPRING_DATASOURCE_PASSWORD: echotrace_secure_password
      ECHOTRACE_FFMPEG_PATH: /usr/bin/ffmpeg
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echotrace-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
