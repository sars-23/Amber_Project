server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0

spring:
  application:
    name: amber
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/amber}
    username: ${SPRING_DATASOURCE_USERNAME:amber_user}
    password: ${SPRING_DATASOURCE_PASSWORD:amber_secure_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

amber:
  audio:
    sample-rate: ${AMBER_SAMPLE_RATE:11025}
    ffmpeg-path: ${AMBER_FFMPEG_PATH:ffmpeg}
    max-duration-seconds: 600
    min-duration-seconds: 1
    max-file-size-bytes: 26214400
  dsp:
    fft-size: ${AMBER_FFT_SIZE:1024}
    hop-size: ${AMBER_HOP_SIZE:512}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.onrender.com,https://*.vercel.app}
  admin:
    api-key: ${AMBER_ADMIN_API_KEY:}
  proxy:
    behind-proxy: ${AMBER_BEHIND_PROXY:true}
  rate-limit:
    benchmark:
      max-requests: 10
      window-seconds: 60
      max-tracked-clients: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
