server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: echotrace
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/echotrace}
    username: ${SPRING_DATASOURCE_USERNAME:echotrace_user}
    password: ${SPRING_DATASOURCE_PASSWORD:echotrace_secure_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

echotrace:
  audio:
    sample-rate: ${ECHOTRACE_SAMPLE_RATE:11025}
    ffmpeg-path: ${ECHOTRACE_FFMPEG_PATH:C:\Users\rezsi\AppData\Local\Programs\Stremio\ffmpeg.exe}
    max-duration-seconds: 600
    min-duration-seconds: 1
    max-file-size-bytes: 26214400
  dsp:
    fft-size: ${ECHOTRACE_FFT_SIZE:1024}
    hop-size: ${ECHOTRACE_HOP_SIZE:512}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
