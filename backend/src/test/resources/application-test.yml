spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:amber_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

amber:
  audio:
    sample-rate: 11025
    ffmpeg-path: ${AMBER_FFMPEG_PATH:ffmpeg}
    max-duration-seconds: 600
    min-duration-seconds: 1
    max-file-size-bytes: 26214400
  dsp:
    fft-size: 1024
    hop-size: 512
  admin:
    api-key: test-admin-secret-key
  proxy:
    behind-proxy: true
